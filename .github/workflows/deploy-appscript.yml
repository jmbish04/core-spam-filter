name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Deploy to both environments
        env:
          GMAIL_SCRIPT_ID: ${{ secrets.GMAIL_SCRIPT_ID }}
          COLBY_SCRIPT_ID: ${{ secrets.COLBY_SCRIPT_ID }}
        run: |
          chmod +x scripts/deploy-appscript.sh
          bash scripts/deploy-appscript.sh
