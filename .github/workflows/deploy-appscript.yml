name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
  workflow_dispatch:
      inputs:
        target_project:
          description: 'Which project to deploy to'
          required: true
          type: choice
          default: 'both'
          options:
            - both
            - 126colby
            - gmail

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Execute Deployment Script
        id: deploy_script
        env:
          APPSCRIPT_PROJECT_ID_GMAIL: ${{ secrets.APPSCRIPT_PROJECT_ID_GMAIL }}
          APPSCRIPT_PROJECT_ID_126COLBY: ${{ secrets.APPSCRIPT_PROJECT_ID_126COLBY }}
          TARGET_PROJECT: ${{ github.event.inputs.target_project || 'both' }}
        run: |
          chmod +x scripts/deploy-appscript.sh
          bash scripts/deploy-appscript.sh

      - name: Output Deployment URLs
        run: |
          echo "=================================================="
          echo "🚀 APPS SCRIPT EDITOR URLs"
          echo "=================================================="
          
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
             echo "### 🚀 Apps Script Deployments" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.deploy_script.outputs.deployed_126colby }}" == "true" ]; then
            echo "126Colby Project: ${{ steps.deploy_script.outputs.url_126colby }}"
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "- **126Colby Project**: [Open in Editor](${{ steps.deploy_script.outputs.url_126colby }})" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          if [ "${{ steps.deploy_script.outputs.deployed_gmail }}" == "true" ]; then
            echo "Gmail Project:    ${{ steps.deploy_script.outputs.url_gmail }}"
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "- **Gmail Project**: [Open in Editor](${{ steps.deploy_script.outputs.url_gmail }})" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "=================================================="
