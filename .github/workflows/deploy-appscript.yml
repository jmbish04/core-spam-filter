name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
  workflow_dispatch:
      inputs:
        target_project:
          description: 'Which project to deploy to'
          required: true
          type: choice
          default: 'both'
          options:
            - both
            - 126colby
            - gmail

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Deploy to environments
        env:
          APPSCRIPT_PROJECT_ID_GMAIL: ${{ secrets.APPSCRIPT_PROJECT_ID_GMAIL }}
          APPSCRIPT_PROJECT_ID_126COLBY: ${{ secrets.APPSCRIPT_PROJECT_ID_126COLBY }}
        run: |
          chmod +x scripts/deploy-appscript.sh
          bash scripts/deploy-appscript.sh
          
          # Print to the GitHub Actions Console Log
          echo "=================================================="
          echo "🚀 APPS SCRIPT EDITOR URLs"
          echo "=================================================="
          echo "126Colby Project: https://script.google.com/d/$APPSCRIPT_PROJECT_ID_126COLBY/edit"
          echo "Gmail Project:    https://script.google.com/d/$APPSCRIPT_PROJECT_ID_GMAIL/edit"
          echo "=================================================="
          
          # Append to the GitHub Actions Workflow Summary (Clickable Links on the run page)
          echo "### 🚀 Apps Script Deployments" >> $GITHUB_STEP_SUMMARY
          echo "- **126Colby Project**: [Open in Editor](https://script.google.com/d/$APPSCRIPT_PROJECT_ID_126COLBY/edit)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gmail Project**: [Open in Editor](https://script.google.com/d/$APPSCRIPT_PROJECT_ID_GMAIL/edit)" >> $GITHUB_STEP_SUMMARY
