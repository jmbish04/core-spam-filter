name: Production Deployment (Apps Script + Cloudflare)

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Which GAS project to deploy'
        required: true
        type: choice
        default: 'both'
        options:
          - both
          - 126colby
          - gmail

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. ARCHIVE LOGIC (From your first snippet) ---
      - name: Archive .txt files
        run: |
          mkdir -p src/archive
          find src -type f -name "*.txt" -not -path "src/archive/*" | while read -r file; do
            rel_path="${file#src/}"
            target_dir="src/archive/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            mv "$file" "$target_dir/$(basename "$rel_path")"
          done

      - name: Commit and Push Archived Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --staged --quiet; then
            git commit -m "chore: archive .txt files [skip ci]"
            git push
          fi

      # --- 2. APPS SCRIPT DEPLOYMENT ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp, pnpm & Dependencies
        run: |
          npm install -g @google/clasp pnpm
          pnpm install

      # - name: Provide Authentication (Python Setup)
      #   run: python3 scripts/setup-clasp.py
      #   env:
      #     CLASPRC_JSON_RAW: ${{ secrets.CLASPRC_JSON }}

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json          

      # - name: Execute Deployment Script
      #   id: deploy_script
      #   env:
      #     APPSCRIPT_PROJECT_ID_GMAIL: ${{ secrets.APPSCRIPT_PROJECT_ID_GMAIL }}
      #     APPSCRIPT_PROJECT_ID_126COLBY: ${{ secrets.APPSCRIPT_PROJECT_ID_126COLBY }}
      #     # These ensure you don't get new URLs every time
      #     # PROD_DEPLOYMENT_ID_GMAIL: ${{ secrets.PROD_DEPLOYMENT_ID_GMAIL }}
      #     # PROD_DEPLOYMENT_ID_126COLBY: ${{ secrets.PROD_DEPLOYMENT_ID_126COLBY }}
      #     TARGET_PROJECT: ${{ github.event.inputs.target_project || 'both' }}
      #   run: |
      #     chmod +x scripts/deploy-appscript.sh
      #     bash scripts/deploy-appscript.sh

      - name: Execute Unified Deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPSCRIPT_PROJECT_ID_GMAIL: ${{ secrets.APPSCRIPT_PROJECT_ID_GMAIL }}
          APPSCRIPT_PROJECT_ID_126COLBY: ${{ secrets.APPSCRIPT_PROJECT_ID_126COLBY }}
          PROD_DEPLOYMENT_ID_GMAIL: ${{ secrets.PROD_DEPLOYMENT_ID_GMAIL }}
          PROD_DEPLOYMENT_ID_126COLBY: ${{ secrets.PROD_DEPLOYMENT_ID_126COLBY }}
          TARGET_PROJECT: ${{ github.event.inputs.target_project || 'both' }}
        run: node scripts/deploy-appsscript-auto-detected-prod.js

      # --- 3. CLOUDFLARE WORKER DEPLOYMENT ---
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This ensures the worker is updated on every push to main
          command: deploy # --env production

      - name: Output Summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloudflare**: Worker updated to latest production build." >> $GITHUB_STEP_SUMMARY
          echo "- **Apps Script**: Pushed to existing Deployment IDs (URLs Stable)." >> $GITHUB_STEP_SUMMARY
