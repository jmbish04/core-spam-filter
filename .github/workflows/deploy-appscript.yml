name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'appscript/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account:
          - name: account1
            script_id_secret: APPS_SCRIPT_ID_1
          - name: account2
            script_id_secret: APPS_SCRIPT_ID_2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Create .clasp.json for ${{ matrix.account.name }}
        run: |
          cat > .clasp.json << EOF
          {
            "scriptId": "${{ secrets[matrix.account.script_id_secret] }}",
            "rootDir": "appscript",
            "filePushOrder": [
              "appscript/appsscript.json",
              "appscript/Utils.js",
              "appscript/Config.js",
              "appscript/RuleManager.js",
              "appscript/EmailProcessor.js",
              "appscript/TriggerManager.js",
              "appscript/Addon.js",
              "appscript/Code.js"
            ]
          }
          EOF

      - name: Push to Google Apps Script (${{ matrix.account.name }})
        run: clasp push --force

